<aside class="bg-tema-primary relative flex h-screen w-64 flex-col shadow-xl">
  <!-- Patrón de puntos dinámico (sin clases arbitrarias) -->
  <div class="pointer-events-none absolute inset-0"></div>

  <!-- Cabecera -->
  <div class="relative z-10 flex h-20 items-center gap-3 border-b px-5 py-4" [ngClass]="!temaService.isLight() ? 'border-white/5' : 'border-slate-200'">
    <div
      class="flex h-9 w-9 items-center justify-center rounded-lg shadow-sm"
      [ngClass]="!temaService.isLight() ? 'bg-white/10 text-white' : 'bg-slate-800/10 text-slate-800'"
    >
      <svg class="size-7" viewBox="0 0 24 24" lucideShieldAlert></svg>
    </div>
    <span class="text-lg font-semibold tracking-tight" [ngClass]="!temaService.isLight() ? 'text-white' : 'text-slate-800'">
      AML<span class="font-light" [ngClass]="!temaService.isLight() ? 'text-slate-400' : 'text-slate-500'">|Cordova</span>
    </span>
  </div>

  <!-- Navegación -->
  <nav class="relative z-10 flex-1 space-y-1 overflow-y-auto px-3 py-6 text-xl">
    <!-- Monitoreo -->
    <details class="group">
      <summary
        class="flex cursor-pointer list-none items-center gap-3 rounded-lg px-3 py-4 font-medium transition"
        [ngClass]="
          !temaService.isLight()
            ? 'text-tema-texto-primary-light hover:bg-tema-hover-simple-white hover:text-slate-50'
            : 'text-tema-texto-primary-dark hover:bg-tema-hover-simple-black hover:text-slate-900'
        "
      >
        <svg class="size-7" viewBox="0 0 24 24" lucideUserCheck></svg>
        <span class="flex-1">Monitoreo</span>
        <svg class="h-4 w-4 shrink-0 transition-transform duration-200 group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </summary>
      <div class="ml-5 grid grid-rows-[0fr] transition-all duration-300 ease-out group-open:grid-rows-[1fr]">
        <div class="overflow-hidden text-base">
          <div class="">
            <a
              href="#"
              class="rounded-lg px-3 py-2 transition flex items-center"
              [ngClass]="
                !temaService.isLight()
                  ? 'text-tema-texto-primary-light hover:bg-tema-hover-simple-white hover:text-slate-50'
                  : 'text-tema-texto-primary-dark hover:bg-tema-hover-simple-black hover:text-slate-900'
              "
              >
              <svg class="size-7" viewBox="0 0 24 24" lucideDot></svg>
              Alertas activas
              </a
            >
            <a
              href="#"
              class="rounded-lg px-3 py-2 transition flex items-center gap-1"
              [ngClass]="
                !temaService.isLight()
                  ? 'text-tema-texto-primary-light hover:bg-tema-hover-simple-white hover:text-slate-50'
                  : 'text-tema-texto-primary-dark hover:bg-tema-hover-simple-black hover:text-slate-900'
              "
              >
              <svg class="size-7" viewBox="0 0 24 24" lucideDot></svg>
              Alertas activas
              </a
            >
          </div>
        </div>
      </div>
    </details>
  </nav>

  <!-- Footer -->
  <div class="relative z-10 border-t px-5 py-4" [ngClass]="!temaService.isLight() ? 'border-white/5' : 'border-slate-200'">
    <div
      class="inline-block rounded-full border px-3 py-1 text-xs"
      [ngClass]="!temaService.isLight() ? 'border-white/10 bg-white/5 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-600'"
    >
      Cumplimiento GAFI | ISO 37001
    </div>
  </div>
</aside>
