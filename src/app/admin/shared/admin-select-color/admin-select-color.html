<div class="select-root relative w-full">
  @if (label) {
    <label class="mb-1.5 block text-xs font-bold tracking-wider text-slate-500 uppercase">
      {{ label }}
    </label>
  }

  <div
    (click)="toggleDropdown()"
    class="relative flex w-full cursor-pointer items-center justify-between rounded-lg border-2 bg-slate-50 py-2 transition-all outline-none"
    [class.bg-white]="isOpen()"
    [class.hover:cursor-not-allowed]="disabled()"
    [class]="isOpen() ? 'border-[#2db2b1] ring-4 ring-[#2db2b1]/10' : 'border-slate-300'"
  >
    <div class="flex items-center gap-3 px-3">
      <div class="h-6 w-6 rounded-md border border-slate-200 shadow-sm" [style.background]="hexValue() || '#FFFFFF'"></div>
      <span [class.text-slate-700]="hexValue()" class="text-sm font-semibold text-slate-400 uppercase">{{
        hexValue() || placeholder
      }}</span>
    </div>
  </div>

  @if (isOpen()) {
    <div
      (click)="$event.stopPropagation()"
      class="animate-in fade-in zoom-in-95 shadow-x absolute z-50 mt-2 w-full max-w-sm min-w-[240px] rounded-2xl border border-slate-200 bg-white p-4"
    >
      <div class="mb-3 h-6 w-full rounded-md border border-slate-200 shadow-inner" [style.background]="hexValue()"></div>

      <div
        #colorArea
        (mousedown)="onAreaMouseDown($event)"
        class="relative h-40 w-full cursor-crosshair overflow-hidden rounded-lg shadow-inner"
        [style.background-color]="'hsl(' + hue() + ', 100%, 50%)'"
      >
        <div
          class="pointer-events-none absolute inset-0"
          style="background: linear-gradient(to right, #ffffff 0%, rgba(255, 255, 255, 0) 100%)"
        ></div>
        <div
          class="pointer-events-none absolute inset-0"
          style="background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, #000000 100%)"
        ></div>

        <div
          class="pointer-events-none absolute h-5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-md transition-none"
          [style.left.%]="saturation()"
          [style.top.%]="100 - brightness()"
        ></div>
      </div>

      <div class="mt-4 flex items-center justify-center">
        <input
          type="range"
          min="0"
          max="360"
          [value]="hue()"
          (input)="onHueChange($event)"
          class="color-slider-input w-full cursor-pointer appearance-none border border-slate-200 outline-none"
          [style.color]="'hsl(' + hue() + ', 100%, 50%)'"
          style="
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
          "
        />
      </div>

      <div class="mt-5 grid grid-cols-5 gap-2">
        @for (color of presets; track color) {
          <button
            type="button"
            (click)="selectPreset(color)"
            class="h-8 w-full rounded-md border border-slate-200 shadow-sm transition-transform hover:scale-110 focus:ring-2 focus:ring-[#2db2b1] focus:ring-offset-1 focus:outline-none"
            [style.background]="color"
          ></button>
        }
      </div>

      <div class="mt-5 flex items-center gap-2 border-t border-slate-100 pt-4">
        <input
          type="text"
          [value]="hexValue()"
          (input)="onHexInput($event)"
          class="w-24 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm font-semibold text-slate-700 uppercase outline-none focus:border-[#2db2b1] focus:bg-white"
        />

        <div class="flex-1"></div>

        <button
          type="button"
          (click)="clear()"
          class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm transition-colors hover:bg-slate-50"
        >
          Limpiar
        </button>
      </div>
    </div>
  }
</div>
