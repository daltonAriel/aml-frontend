<div class="flex flex-col items-center justify-between gap-4 border-t border-slate-100 bg-slate-50/50 px-6 py-4 sm:flex-row">
  
  <div class="flex items-center gap-3 text-sm font-medium text-slate-500">
    <span>Mostrar</span>
    <select
      [value]="pageSize()"
      (change)="onSizeChange($event)"
      class="cursor-pointer rounded-lg border border-slate-200 bg-white px-2 py-1.5 shadow-sm outline-none transition-all focus:border-[#2db2b1] focus:ring-2 focus:ring-[#2db2b1]/20"
    >
      <option [value]="10">10</option>
      <option [value]="25">20</option>
      <option [value]="50">40</option>
    </select>
    <span>registros</span>
  </div>

  <div class="text-sm text-slate-500">
    Mostrando <span class="font-bold text-slate-900">{{ startIndex() }}</span> a
    <span class="font-bold text-slate-900">{{ endIndex() }}</span> de
    <span class="font-bold text-slate-900">{{ totalElements() }}</span>
  </div>

  <div class="flex items-center gap-1">
    
    <button type="button"
      (click)="onPageClick(1)"
      [disabled]="currentPage() === 0"
      class="pagination-btn-nav"
      title="Primera página"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <title>Primera página</title>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>

    <button type="button"
      (click)="onPageClick(currentPage())"
      [disabled]="currentPage() === 0"
      class="pagination-btn-nav"
      title="Anterior"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <title>Anterior</title>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <div class="flex items-center gap-1 mx-1">
      @for (page of visiblePages(); track $index) {
        @if (page === '...') {
          <span class="flex h-8 w-8 items-center justify-center text-slate-400 font-medium">...</span>
        } @else {
          <button type="button"
            (click)="onPageClick(page)"
            [class.active]="(currentPage() + 1) === page"
            class="pagination-number"
          >
            {{ page }}
          </button>
        }
      }
    </div>

    <button type="button"
      (click)="onPageClick(currentPage() + 2)"
      [disabled]="currentPage() + 1 >= totalPages()"
      class="pagination-btn-nav"
      title="Siguiente"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <title>Siguiente</title>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <button type="button"
      (click)="onPageClick(totalPages())"
      [disabled]="currentPage() + 1 >= totalPages()"
      class="pagination-btn-nav"
      title="Última página"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <title>Última página</title>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
